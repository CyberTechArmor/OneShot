# Discovery Briefing
# Handoff package from Discovery phase to Design phase
# Project: OneShot - Collaborative Intelligence Development Platform

project: "OneShot"
discovery_completed: "2026-01-05"
discovery_owner: "Thomas (Fractionate LLC)"

# Artifact locations relative to project root
artifacts:
  problem_statement: "docs/discovery/problem-statement.md"
  personas:
    - "docs/discovery/personas/product-visionary.md"
    - "docs/discovery/personas/fractional-consultant.md"
    - "docs/discovery/personas/instance-administrator.md"
  success_criteria: "docs/discovery/success-criteria.md"
  constraints: "docs/discovery/constraints.md"
  scope_boundaries: "docs/discovery/scope-boundaries.md"
  risk_register: "docs/discovery/risk-register.md"

# Summary of key decisions made during Discovery
decisions_summary:
  - decision: "Voice conversation is the core differentiator"
    rationale: "Text-only would be indistinguishable from using an LLM directly"
    decided_by: "Thomas"
    date: "2026-01-05"
  - decision: "LiveKit deferred to v1.1 but architecture prepared"
    rationale: "Multi-user video adds complexity; single-user voice is the MVP"
    decided_by: "Thomas"
    date: "2026-01-05"
  - decision: "Single-tenant architecture with multi-instance scaling"
    rationale: "Simpler architecture; SaaS multi-tenancy via subdomains"
    decided_by: "Thomas"
    date: "2026-01-05"
  - decision: "ElevenLabs as sole voice vendor"
    rationale: "Single vendor simplifies integration; accepted dependency risk"
    decided_by: "Thomas"
    date: "2026-01-05"
  - decision: "Sustainable Use License (n8n model)"
    rationale: "Source-available, free to self-host, protects against competing managed services"
    decided_by: "Thomas"
    date: "2026-01-05"
  - decision: "CID prompts built into AI as skills, only build prompt generated"
    rationale: "Discovery/Design/Stack are structured processes; build needs project-specific context"
    decided_by: "Thomas"
    date: "2026-01-05"

# Compliance determination
compliance:
  mode: "none"
  requirements_identified: []
  key_constraints_for_design: []

# Technical constraints for Design phase
technical_constraints:
  stack:
    - "TypeScript (CID Stack standard)"
    - "Express backend"
    - "React frontend"
    - "Drizzle ORM"
    - "Zod validation"
    - "Vitest testing"
    - "PostgreSQL database"
  infrastructure:
    - "Docker with Docker Compose"
    - "Single install script with interactive prompts"
    - "Reverse proxy (Caddy/Traefik) default on, auto-SSL"
    - "Default port 5090"
    - "GitHub-built container image"
  integrations:
    - name: "ElevenLabs"
      type: "REST API"
      notes: "STT for user input, TTS for AI output; single vendor for voice pipeline"
    - name: "Anthropic Claude"
      type: "REST API"
      notes: "Default AI vendor; Claude Opus 4.5"
    - name: "OpenAI"
      type: "REST API"
      notes: "Alternative AI vendor"
    - name: "LiveKit"
      type: "Self-hosted"
      notes: "v1.1; architecture prepared in v1; 1-4 concurrent users max"
    - name: "S3-compatible storage"
      type: "REST API"
      notes: "Optional; local filesystem default"
    - name: "SMTP"
      type: "SMTP"
      notes: "Magic link authentication"
  scale:
    concurrent_users: 4
    data_volume: "Low-moderate; primarily text documents and transcripts"


# Session continuity for AI collaboration
continuation_context: |
  OneShot is the CID Framework productized. Instead of manually chaining prompts
  (discovery → design → stack → build), the platform guides users through the
  workflow and captures everything—especially voice conversations.
  
  Key decisions:
  - Voice is the differentiator (not optional)
  - ElevenLabs for STT/TTS (accepted single-vendor risk)
  - Claude Opus 4.5 default, multi-vendor supported
  - LiveKit for multi-user deferred to v1.1 (architecture prepared)
  - Single-tenant, many users, multi-instance via subdomains
  - n8n-style Sustainable Use License
  
  The voice pipeline: User speaks → ElevenLabs STT → Claude → ElevenLabs TTS → User hears
  
  Critical UX requirement: Conversation must feel smooth. Prototype was successful.
  
  CID skills (Discovery/Design/Stack) are built into the AI. Only the Build prompt
  is generated from the three phase outputs, ready to paste into Claude Code.
  
  Token tracking at three levels: per session, per phase, per project.
  
  Installation: Single script, Docker Compose, reverse proxy default on, port 5090.


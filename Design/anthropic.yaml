# Integration Contract: Anthropic
# AI vendor: Claude models for CID conversations
# OneShot - CID Platform

name: "anthropic"
type: "REST"
version: "2024-01-01"  # API version header
documentation_url: "https://docs.anthropic.com/en/api"

authentication:
  type: "API Key"
  header: "x-api-key"
  credentials_location: "ANTHROPIC_API_KEY environment variable"

base_url:
  production: "https://api.anthropic.com"
  # No staging/sandbox environment

rate_limits:
  requests_per_minute: 60  # Varies by tier
  tokens_per_minute: 80000  # Varies by tier
  headers:
    remaining_requests: "anthropic-ratelimit-requests-remaining"
    remaining_tokens: "anthropic-ratelimit-tokens-remaining"
    reset_requests: "anthropic-ratelimit-requests-reset"
    reset_tokens: "anthropic-ratelimit-tokens-reset"
  backoff_strategy: "exponential"

# ============================================================================
# Endpoints Used
# ============================================================================

endpoints_used:
  # Messages API (primary)
  - name: "Create Message"
    method: "POST"
    path: "/v1/messages"
    purpose: "Send conversation messages and receive AI responses"
    request:
      headers:
        - name: "anthropic-version"
          value: "2024-01-01"
          required: true
        - name: "anthropic-beta"
          value: "prompt-caching-2024-07-31"
          required: false
          description: "Enable prompt caching for system prompts"
      body_schema:
        type: "object"
        required: ["model", "max_tokens", "messages"]
        properties:
          model:
            type: "string"
            description: "Model identifier"
            example: "claude-opus-4-5-20250514"
          max_tokens:
            type: "integer"
            description: "Maximum tokens in response"
            default: 4096
          system:
            type: "string"
            description: "System prompt (CID phase prompt)"
          messages:
            type: "array"
            description: "Conversation history"
            items:
              type: "object"
              properties:
                role:
                  type: "string"
                  enum: ["user", "assistant"]
                content:
                  type: "string"
          temperature:
            type: "number"
            minimum: 0
            maximum: 1
            default: 0.7
          stream:
            type: "boolean"
            default: true
            description: "Enable streaming response"
    response:
      success_codes: [200]
      schema:
        type: "object"
        properties:
          id:
            type: "string"
          type:
            type: "string"
            enum: ["message"]
          role:
            type: "string"
            enum: ["assistant"]
          content:
            type: "array"
            items:
              type: "object"
              properties:
                type:
                  type: "string"
                  enum: ["text"]
                text:
                  type: "string"
          model:
            type: "string"
          stop_reason:
            type: "string"
          usage:
            type: "object"
            properties:
              input_tokens:
                type: "integer"
              output_tokens:
                type: "integer"
              cache_creation_input_tokens:
                type: "integer"
              cache_read_input_tokens:
                type: "integer"
    rate_limit_weight: 1

  # Messages API (streaming)
  - name: "Create Message (Streaming)"
    method: "POST"
    path: "/v1/messages"
    purpose: "Stream AI responses for real-time display"
    request:
      body_schema:
        type: "object"
        properties:
          stream:
            type: "boolean"
            const: true
          # ... same as non-streaming
    response:
      success_codes: [200]
      content_type: "text/event-stream"
      streaming: true
      events:
        - type: "message_start"
          description: "Initial message metadata"
        - type: "content_block_start"
          description: "Start of content block"
        - type: "content_block_delta"
          description: "Incremental text content"
        - type: "content_block_stop"
          description: "End of content block"
        - type: "message_delta"
          description: "Usage statistics and stop reason"
        - type: "message_stop"
          description: "End of message"

  # Token counting (optional, for pre-flight estimation)
  - name: "Count Tokens"
    method: "POST"
    path: "/v1/messages/count_tokens"
    purpose: "Estimate token usage before sending (optional optimization)"
    request:
      body_schema:
        type: "object"
        required: ["model", "messages"]
        properties:
          model:
            type: "string"
          messages:
            type: "array"
    response:
      success_codes: [200]
      schema:
        type: "object"
        properties:
          input_tokens:
            type: "integer"

# ============================================================================
# Error Handling
# ============================================================================

error_handling:
  retry_on: [429, 500, 502, 503, 529]
  max_retries: 3
  backoff:
    type: "exponential"
    initial_delay_ms: 1000
    max_delay_ms: 60000
    multiplier: 2
  circuit_breaker:
    enabled: true
    failure_threshold: 3
    reset_timeout_ms: 120000

error_codes:
  - code: 400
    meaning: "Invalid request (bad model, message format)"
    action: "Validate input; log and surface user-friendly error"
  - code: 401
    meaning: "Invalid API key"
    action: "Check ANTHROPIC_API_KEY configuration"
  - code: 403
    meaning: "Permission denied (model access)"
    action: "Verify API key tier allows model access"
  - code: 429
    meaning: "Rate limited"
    action: "Apply exponential backoff; consider request queuing"
  - code: 529
    meaning: "API overloaded"
    action: "Retry with backoff; notify user of delay"

# ============================================================================
# Data Mapping
# ============================================================================

data_mapping:
  inbound:
    # Response processing
    "content[0].text": "responseText"
    "usage.input_tokens": "inputTokens"
    "usage.output_tokens": "outputTokens"
    "stop_reason": "finishReason"
  outbound:
    # Request building
    "conversationHistory": "messages"
    "systemPrompt": "system"
    "aiModel": "model"

# ============================================================================
# System Prompts (CID Phases)
# ============================================================================

system_prompts:
  discovery:
    description: "Discovery phase system prompt"
    location: "Built into application; references CID Discovery skill"
    cache_control:
      type: "ephemeral"
      description: "Enable prompt caching for repeated conversations"
  
  design:
    description: "Design phase system prompt"
    location: "Built into application; references CID Design skill"
  
  stack:
    description: "Stack phase system prompt"
    location: "Built into application; references CID Stack skill"

# ============================================================================
# Token Tracking Requirements
# ============================================================================

token_tracking:
  required: true
  granularity:
    - "per_request"
    - "per_conversation"
    - "per_phase"
    - "per_project"
  fields:
    - "input_tokens"
    - "output_tokens"
    - "cache_creation_input_tokens"
    - "cache_read_input_tokens"
  storage: "token_usage table"
  cost_estimation:
    enabled: true
    pricing_note: "Prices change; store cents not dollars; update periodically"

# ============================================================================
# Context Window Management
# ============================================================================

context_window:
  models:
    "claude-opus-4-5-20250514":
      max_tokens: 200000
      output_max: 32000
  strategy:
    approach: "summarization"
    threshold_percentage: 75
    description: |
      When conversation approaches 75% of context window:
      1. Warn user visually (token usage indicator)
      2. Offer to summarize older messages
      3. Preserve system prompt and recent messages
    risk_id: "R3"

# ============================================================================
# CID Task Classification
# ============================================================================

ai_delegation:
  suitable_tasks:
    - "HTTP client implementation"
    - "Streaming response parsing (SSE)"
    - "Token counting and tracking"
    - "Error handling and retry logic"
    - "Request/response type definitions"
    - "Rate limit header parsing"
  human_required:
    - "System prompt design (CID phases)"
    - "Model selection decisions"
    - "Context window summarization strategy"
    - "Token budget policy decisions"
    - "Error message content for users"
    - "Temperature and parameter tuning"

# ============================================================================
# Notes
# ============================================================================

notes: |
  Anthropic Claude is the default AI vendor for OneShot.
  
  Key implementation considerations:
  
  1. Streaming is preferred for UX (real-time response display)
  2. Prompt caching should be enabled for system prompts
  3. Token tracking is critical for cost visibility (constraint DATA-003)
  4. Context window limits are the primary risk (R3)
  
  Model recommendations:
  - Default: claude-opus-4-5-20250514 (best quality for CID)
  - Alternative: claude-sonnet-4-5-20250929 (faster, cheaper)
  
  CID system prompts:
  - Built into application, not user-configurable in v1
  - Reference the CID Discovery/Design/Stack skills
  - Prompt caching reduces cost for repeated system prompts

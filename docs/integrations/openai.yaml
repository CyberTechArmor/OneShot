# Integration Contract: OpenAI
# AI vendor: GPT models as alternative to Anthropic
# OneShot - CID Platform

name: "openai"
type: "REST"
version: "v1"
documentation_url: "https://platform.openai.com/docs/api-reference"

authentication:
  type: "Bearer Token"
  header: "Authorization"
  format: "Bearer {api_key}"
  credentials_location: "OPENAI_API_KEY environment variable"

base_url:
  production: "https://api.openai.com/v1"
  # No staging; use same endpoint

rate_limits:
  requests_per_minute: 500  # Varies by tier
  tokens_per_minute: 150000  # Varies by tier
  headers:
    remaining_requests: "x-ratelimit-remaining-requests"
    remaining_tokens: "x-ratelimit-remaining-tokens"
    reset_requests: "x-ratelimit-reset-requests"
    reset_tokens: "x-ratelimit-reset-tokens"
  backoff_strategy: "exponential"

# ============================================================================
# Endpoints Used
# ============================================================================

endpoints_used:
  # Chat Completions API
  - name: "Create Chat Completion"
    method: "POST"
    path: "/chat/completions"
    purpose: "Send conversation messages and receive AI responses"
    request:
      body_schema:
        type: "object"
        required: ["model", "messages"]
        properties:
          model:
            type: "string"
            description: "Model identifier"
            example: "gpt-4o"
          messages:
            type: "array"
            description: "Conversation history including system message"
            items:
              type: "object"
              properties:
                role:
                  type: "string"
                  enum: ["system", "user", "assistant"]
                content:
                  type: "string"
          max_tokens:
            type: "integer"
            description: "Maximum tokens in response"
            default: 4096
          temperature:
            type: "number"
            minimum: 0
            maximum: 2
            default: 0.7
          stream:
            type: "boolean"
            default: true
            description: "Enable streaming response"
          stream_options:
            type: "object"
            properties:
              include_usage:
                type: "boolean"
                default: true
                description: "Include token usage in stream"
    response:
      success_codes: [200]
      schema:
        type: "object"
        properties:
          id:
            type: "string"
          object:
            type: "string"
            enum: ["chat.completion"]
          created:
            type: "integer"
          model:
            type: "string"
          choices:
            type: "array"
            items:
              type: "object"
              properties:
                index:
                  type: "integer"
                message:
                  type: "object"
                  properties:
                    role:
                      type: "string"
                    content:
                      type: "string"
                finish_reason:
                  type: "string"
          usage:
            type: "object"
            properties:
              prompt_tokens:
                type: "integer"
              completion_tokens:
                type: "integer"
              total_tokens:
                type: "integer"
    rate_limit_weight: 1

  # Chat Completions (Streaming)
  - name: "Create Chat Completion (Streaming)"
    method: "POST"
    path: "/chat/completions"
    purpose: "Stream AI responses for real-time display"
    request:
      body_schema:
        type: "object"
        properties:
          stream:
            type: "boolean"
            const: true
          stream_options:
            type: "object"
            properties:
              include_usage:
                type: "boolean"
                const: true
    response:
      success_codes: [200]
      content_type: "text/event-stream"
      streaming: true
      events:
        - type: "data"
          description: "Incremental response chunks"
          schema:
            type: "object"
            properties:
              choices:
                type: "array"
                items:
                  type: "object"
                  properties:
                    delta:
                      type: "object"
                      properties:
                        content:
                          type: "string"
              usage:
                type: "object"
                description: "Final chunk includes usage"
        - type: "[DONE]"
          description: "End of stream marker"

# ============================================================================
# Error Handling
# ============================================================================

error_handling:
  retry_on: [429, 500, 502, 503]
  max_retries: 3
  backoff:
    type: "exponential"
    initial_delay_ms: 1000
    max_delay_ms: 60000
    multiplier: 2
  circuit_breaker:
    enabled: true
    failure_threshold: 3
    reset_timeout_ms: 120000

error_codes:
  - code: 400
    meaning: "Invalid request (bad model, message format)"
    action: "Validate input; log and surface user-friendly error"
  - code: 401
    meaning: "Invalid API key"
    action: "Check OPENAI_API_KEY configuration"
  - code: 403
    meaning: "Permission denied (model access, org issues)"
    action: "Verify API key and organization settings"
  - code: 429
    meaning: "Rate limited"
    action: "Apply exponential backoff; parse retry-after header"
  - code: 500
    meaning: "Server error"
    action: "Retry with backoff"

# ============================================================================
# Data Mapping
# ============================================================================

data_mapping:
  inbound:
    # Response processing
    "choices[0].message.content": "responseText"
    "usage.prompt_tokens": "inputTokens"
    "usage.completion_tokens": "outputTokens"
    "choices[0].finish_reason": "finishReason"
  outbound:
    # Request building
    "systemPrompt": "messages[0] with role=system"
    "conversationHistory": "messages[1..n]"
    "aiModel": "model"

# ============================================================================
# Interface Normalization
# ============================================================================

interface_normalization:
  description: |
    OpenAI and Anthropic have different interfaces. The AI vendor abstraction
    layer normalizes these differences:
    
    1. System prompt: Anthropic uses `system` field; OpenAI uses first message
    2. Token fields: Anthropic `input_tokens`/`output_tokens`; OpenAI `prompt_tokens`/`completion_tokens`
    3. Response structure: Anthropic `content[0].text`; OpenAI `choices[0].message.content`
    4. Streaming format: Different event types and structures
  
  adapter_requirements:
    - "Unified request interface (system, messages, model, maxTokens)"
    - "Unified response interface (text, inputTokens, outputTokens, finishReason)"
    - "Unified streaming interface (onChunk, onComplete callbacks)"

# ============================================================================
# Model Recommendations
# ============================================================================

models:
  recommended:
    - model: "gpt-4o"
      notes: "Best quality/speed balance; recommended for CID"
    - model: "gpt-4-turbo"
      notes: "Good alternative if gpt-4o unavailable"
  context_windows:
    "gpt-4o": 128000
    "gpt-4-turbo": 128000
    "gpt-4": 8192

# ============================================================================
# CID Task Classification
# ============================================================================

ai_delegation:
  suitable_tasks:
    - "HTTP client implementation"
    - "Streaming response parsing (SSE)"
    - "Token counting and tracking"
    - "Error handling and retry logic"
    - "Request/response type definitions"
    - "Interface normalization adapter"
  human_required:
    - "Model selection decisions"
    - "System prompt adaptation (if behavior differs from Claude)"
    - "Temperature and parameter tuning"
    - "Error message content for users"

# ============================================================================
# Notes
# ============================================================================

notes: |
  OpenAI is supported as an alternative AI vendor.
  
  Key differences from Anthropic:
  1. System prompt goes in messages array, not separate field
  2. Token field names differ (prompt_tokens vs input_tokens)
  3. Response structure differs (choices array vs content array)
  4. Streaming event format differs
  
  Implementation priority:
  - OpenAI support is Must Have (M6)
  - Users may prefer GPT models or have existing OpenAI keys
  - Interface abstraction makes vendor switching transparent
  
  Testing considerations:
  - CID prompts developed for Claude may need tuning for GPT
  - Test discovery/design/stack quality with both vendors

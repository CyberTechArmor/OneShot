# Trust Boundary Map
# Documents where data crosses trust zones and required validations
# OneShot - CID Platform

version: "1.0"
project: "OneShot"
updated: "2026-01-05"

zones:
  - id: external
    name: External/Untrusted
    trust_level: 0
    description: "Public internet, browser clients, unauthenticated requests"

  - id: gateway
    name: API Gateway
    trust_level: 1
    description: "After TLS termination and rate limiting, before authentication"

  - id: authenticated
    name: Authenticated Zone
    trust_level: 2
    description: "JWT verified, user identity established, before authorization"

  - id: authorized
    name: Application Layer
    trust_level: 3
    description: "User authorized for specific resource, business logic execution"

  - id: data
    name: Data Layer
    trust_level: 4
    description: "Direct database and file storage access, internal services only"

crossings:
  # External → Gateway
  - from: external
    to: gateway
    name: "Client Request Entry"
    validation_required:
      - "TLS 1.3 termination (Caddy/Traefik)"
      - "Request size limit (10MB default)"
      - "Rate limiting (100 req/min per IP)"
      - "CORS validation"
    data_transforms: []

  # Gateway → Authenticated
  - from: gateway
    to: authenticated
    name: "Authentication Checkpoint"
    validation_required:
      - "JWT signature verification"
      - "Token expiry check"
      - "Token type validation (access vs refresh)"
    data_transforms:
      - "User ID extraction from token"
      - "Role extraction from token"
    exceptions:
      - path: "/api/auth/*"
        reason: "Auth endpoints must be accessible without token"
      - path: "/api/health"
        reason: "Health check for load balancer"

  # Authenticated → Authorized
  - from: authenticated
    to: authorized
    name: "Authorization Checkpoint"
    validation_required:
      - "Resource ownership check (projects, documents)"
      - "Role-based access control (admin routes)"
      - "Project membership verification"
    data_transforms:
      - "User context injection into request"
      - "Project context injection when applicable"

  # Authorized → Data
  - from: authorized
    to: data
    name: "Data Access"
    validation_required:
      - "Input schema validation (Zod)"
      - "Tenant isolation (user_id/project_id filters)"
      - "Soft-delete awareness (exclude deleted_at IS NOT NULL)"
    data_transforms:
      - "Audit log entry for mutations"
      - "Timestamp updates (updated_at)"
      - "Token usage recording for AI calls"

external_integrations:
  # ElevenLabs - Voice Services
  - name: "ElevenLabs STT"
    type: "REST API"
    trust_level: 2
    crossing_to: authorized
    data_direction: "outbound"
    validation_required:
      - "API key authentication"
      - "Audio format validation (before send)"
      - "Response status code check"
      - "Transcript text sanitization"
    data_mapping_notes: |
      User audio → ElevenLabs → Text transcript
      Transcript immediately persisted before further processing
    sensitive_data:
      - "User voice recordings (transient, not stored after processing)"

  - name: "ElevenLabs TTS"
    type: "REST API"
    trust_level: 2
    crossing_to: authorized
    data_direction: "outbound"
    validation_required:
      - "API key authentication"
      - "Text length validation (before send)"
      - "Response audio format validation"
    data_mapping_notes: |
      AI response text → ElevenLabs → Audio stream to client
      Text content comes from AI vendor, already processed
    sensitive_data:
      - "AI response content (may contain project context)"

  # Anthropic Claude
  - name: "Anthropic API"
    type: "REST API"
    trust_level: 2
    crossing_to: authorized
    data_direction: "bidirectional"
    validation_required:
      - "API key authentication"
      - "Model validation (allowed models list)"
      - "Input token estimation (before send)"
      - "Response parsing and validation"
      - "Token count extraction for tracking"
    data_mapping_notes: |
      User message + conversation history + CID system prompt → Claude → AI response
      Token counts (input/output) recorded per call
    sensitive_data:
      - "User project content and requirements"
      - "Conversation history"

  # OpenAI (Alternative)
  - name: "OpenAI API"
    type: "REST API"
    trust_level: 2
    crossing_to: authorized
    data_direction: "bidirectional"
    validation_required:
      - "API key authentication"
      - "Model validation (allowed models list)"
      - "Input token estimation (before send)"
      - "Response parsing and validation"
      - "Token count extraction for tracking"
    data_mapping_notes: |
      Same interface as Anthropic, abstracted through AI vendor layer
    sensitive_data:
      - "User project content and requirements"
      - "Conversation history"

  # S3-Compatible Storage (Optional)
  - name: "S3 Storage"
    type: "REST API"
    trust_level: 3
    crossing_to: data
    data_direction: "bidirectional"
    validation_required:
      - "Credential authentication (access key/secret)"
      - "Bucket policy verification"
      - "Object key sanitization"
      - "Content-type validation"
    data_mapping_notes: |
      Document exports, attachments stored with project-prefixed keys
      Objects keyed by: {project_id}/{document_type}/{uuid}.{ext}
    sensitive_data:
      - "Exported documents (may contain project IP)"
      - "User uploads"

  # SMTP (Magic Links)
  - name: "SMTP Server"
    type: "SMTP"
    trust_level: 1
    crossing_to: gateway
    data_direction: "outbound"
    validation_required:
      - "TLS connection to SMTP server"
      - "Email address format validation"
      - "Magic link token generation (secure random)"
    data_mapping_notes: |
      Magic link emails contain one-time token with 15-minute expiry
      No sensitive project data in emails
    sensitive_data:
      - "User email address"
      - "Magic link token (short-lived)"

data_flow_diagram: |
  ┌─────────────┐     ┌─────────────┐     ┌─────────────┐
  │   Browser   │────▶│   Caddy/    │────▶│   Express   │
  │   Client    │◀────│   Traefik   │◀────│   API       │
  └─────────────┘     └─────────────┘     └─────────────┘
        │                   │                    │
        │ WebSocket         │ TLS               │
        │ (voice stream)    │ termination       │
        ▼                   │                   ▼
  ┌─────────────┐           │            ┌─────────────┐
  │ ElevenLabs  │           │            │ PostgreSQL  │
  │ STT + TTS   │           │            │ Database    │
  └─────────────┘           │            └─────────────┘
                            │                   │
                            │                   │ Drizzle ORM
                            ▼                   ▼
                     ┌─────────────┐     ┌─────────────┐
                     │  Anthropic  │     │   S3 / Local│
                     │  / OpenAI   │     │   Storage   │
                     └─────────────┘     └─────────────┘

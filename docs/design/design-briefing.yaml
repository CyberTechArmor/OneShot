# Design Briefing
# Handoff package from Design phase to Build phase
# Project: OneShot - Collaborative Intelligence Development Platform

project: "OneShot"
design_completed: "2026-01-05"
design_owner: "Thomas (Fractionate LLC)"

# ============================================================================
# Artifact Locations
# ============================================================================

artifacts:
  context_root: "CONTEXT.md"
  constraints: "constraints.yaml"
  trust_boundaries: "docs/design/trust-boundaries.yaml"
  openapi: "docs/design/openapi.yaml"
  schema: "src/db/schema.ts"
  adrs: "docs/adr/"
  integrations:
    - "docs/integrations/elevenlabs.yaml"
    - "docs/integrations/anthropic.yaml"
    - "docs/integrations/openai.yaml"
  discovery_artifacts:
    - "docs/discovery/problem-statement.md"
    - "docs/discovery/success-criteria.md"
    - "docs/discovery/constraints.md"
    - "docs/discovery/scope-boundaries.md"
    - "docs/discovery/risk-register.md"
    - "docs/discovery/personas/"

# ============================================================================
# Decisions Summary
# ============================================================================

decisions_summary:
  - id: "ADR-001"
    title: "Voice-First Architecture"
    impact: "Voice is the primary interaction mode; text is fallback. ElevenLabs STT→AI→TTS pipeline."
    
  - id: "ADR-002"
    title: "ElevenLabs Single Vendor"
    impact: "Use voice abstraction layer (ARCH-002) for future vendor swap capability."
    
  - id: "ADR-003"
    title: "Single-Tenant Architecture"
    impact: "No tenant_id columns; multi-org via separate instances/subdomains."
    
  - id: "ADR-004"
    title: "CID Skills Built-In"
    impact: "Discovery/Design/Stack prompts are constants; only Build prompt is generated output."
    
  - id: "ADR-005"
    title: "LiveKit Deferred to v1.1"
    impact: "Data models include LiveKit fields but ARCH-005 forbids LiveKit imports in v1."

# ============================================================================
# Constraints Summary
# ============================================================================

constraints_summary:
  blocking: 12
  warning: 5
  categories:
    AUTH: 3
    AUTHZ: 3
    DATA: 4
    API: 3
    ARCH: 5
    PERF: 2

key_constraints:
  - id: "AUTH-001"
    summary: "All API routes require authentication except /auth/*"
  - id: "DATA-003"
    summary: "Token usage tracked for all AI calls"
  - id: "DATA-004"
    summary: "Voice transcripts persisted before AI processing"
  - id: "ARCH-001"
    summary: "AI calls through vendor-agnostic interface"
  - id: "ARCH-002"
    summary: "Voice calls through vendor-agnostic interface"

# ============================================================================
# Compliance
# ============================================================================

compliance_mode: "none"
compliance_notes: |
  No regulatory compliance requirements for v1.
  - No HIPAA (no PHI)
  - No GDPR (no EU-specific data handling)
  - No SOC2 (internal tool first)
  
  IP protection is primary concern (user's project ideas/requirements).
  Standard security practices: encryption at rest/transit, access controls.

# ============================================================================
# AI-Delegatable Tasks
# ============================================================================

ai_delegation_ready:
  - task: "Express server scaffolding with TypeScript"
    inputs: "OpenAPI specification, CONTEXT.md, CID Stack patterns"
    constraints: "API-001, API-002, API-003"
    
  - task: "Drizzle migration generation from schema.ts"
    inputs: "src/db/schema.ts"
    constraints: "DATA-001, DATA-002"
    
  - task: "Authentication routes implementation"
    inputs: "OpenAPI /auth/* endpoints, JWT patterns"
    constraints: "AUTH-001, AUTH-002, AUTH-003"
    
  - task: "AI vendor abstraction layer"
    inputs: "Integration contracts (anthropic.yaml, openai.yaml)"
    constraints: "ARCH-001"
    
  - task: "Voice vendor abstraction layer"
    inputs: "Integration contract (elevenlabs.yaml)"
    constraints: "ARCH-002"
    
  - task: "Storage abstraction layer (local + S3)"
    inputs: "Configuration patterns from constraints.md"
    constraints: "ARCH-003"
    
  - task: "Token usage tracking implementation"
    inputs: "tokenUsage table schema, integration contracts"
    constraints: "DATA-003"
    
  - task: "React frontend scaffolding"
    inputs: "OpenAPI specification, responsive design requirement"
    constraints: "M12 (responsive design)"
    
  - task: "Docker Compose configuration"
    inputs: "constraints.md infrastructure section"
    constraints: "Port 5090, reverse proxy optional"
    
  - task: "Install script development"
    inputs: "Configuration defaults, interactive prompt requirements"
    constraints: "Under 30 min installation (persona requirement)"


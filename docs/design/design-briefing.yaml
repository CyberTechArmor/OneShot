# ============================================================================
# Known Issues
# ============================================================================

known_issues:
  - issue: "Context window limits may break long discovery sessions"
    severity: "medium"
    suggested_resolution: "Implement summarization when approaching 75% of context; warn user; offer to start fresh conversation"
    risk_ref: "R3"
    
  - issue: "Rich text editor library not selected"
    severity: "low"
    suggested_resolution: "Evaluate: TipTap, Lexical, Slate. TipTap recommended for markdown support."
    
  - issue: "PDF/DOCX export library not selected"
    severity: "low"
    suggested_resolution: "Evaluate: Pandoc (most complete), pdf-lib + docx (native JS). Pandoc recommended if Docker available."

# ============================================================================
# Open Questions
# ============================================================================

open_questions:
  - question: "What summarization strategy for long conversations?"
    context: "Need to preserve key discovery insights while reducing token count"
    decision_owner: "Build phase implementation"
    blocking: false
    
  - question: "How to handle AI vendor fallback?"
    context: "If Anthropic fails, should we auto-switch to OpenAI?"
    decision_owner: "Product Owner"
    blocking: false
    
  - question: "Voice latency monitoring approach?"
    context: "PERF-002 requires latency logging; need to define format and storage"
    decision_owner: "Build phase implementation"

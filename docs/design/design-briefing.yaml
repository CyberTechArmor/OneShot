  - task: "Token budget policies"
    reason: "Business decision affecting cost and UX"
    
  - task: "Context window summarization strategy"
    reason: "Risk R3 mitigation; affects conversation quality"
    
  - task: "Build prompt format validation"
    reason: "Core value proposition; must work with Claude Code"
    
  - task: "UI/UX design approval"

# ============================================================================
# Continuation Context
# ============================================================================

continuation_context: |
  OneShot is the CID Framework productized as a voice-first platform.
  
  Key architectural decisions:
  - Voice-first: ElevenLabs STT → Claude/OpenAI → ElevenLabs TTS
  - Single-tenant: Multi-org via separate instances
  - CID skills built-in: Only Build prompt is generated output
  - LiveKit v1.1: Data models ready, no code in v1
  
  Technology stack (CID standard):
  - TypeScript, Express, Drizzle, Zod, Vitest, React, PostgreSQL
  - Docker Compose deployment, Caddy/Traefik reverse proxy
  - Default port 5090
  
  Critical constraints:
  - ARCH-001/002/003: Vendor abstraction layers required
  - DATA-003: Token tracking on all AI calls
  - DATA-004: Transcripts saved before AI processing
  - AUTH-001: All API routes authenticated except /auth/*
  
  The 20 Must Have criteria define v1 launch requirements.
  Voice conversation smoothness is the core UX differentiator.
  
  Build should follow CID Build methodology with the included constraints
  manifest and trust boundary definitions for secure implementation.

